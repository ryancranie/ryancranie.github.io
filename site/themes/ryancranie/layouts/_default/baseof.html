<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  {{ $css := resources.Get "css/main.css" | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}">
  <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ "/img/profile/ryan_profile_picture.jpg" | absURL }}{{ end }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta name="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else if .IsHome }}{{ .Site.Params.description }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}">
  <meta name="twitter:image" content="{{ if .Params.image }}{{ .Params.image | absURL }}{{ else }}{{ "/img/profile/ryan_profile_picture.jpg" | absURL }}{{ end }}">

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/img/icons/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png">
  <link rel="manifest" href="/img/icons/site.webmanifest">

  <!-- Canonical -->
  <link rel="canonical" href="{{ .Permalink }}">
</head>

<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: true,
    theme: 'dark',
    themeVariables: {
      background: '#000000',
      primaryColor: '#000000',
      primaryTextColor: 'rgba(255,255,255,0.7)',
      primaryBorderColor: 'rgba(255,255,255,0.3)',
      lineColor: 'rgba(255,255,255,0.3)',
      fontSize: '13px'
    }
  });
</script>

<div class="carousel-fullscreen-overlay" id="fs-overlay"
  onclick="document.getElementById('fs-overlay').classList.remove('active')">
  <img id="fs-img" src="" />
</div>

<button id="mob-btn" aria-label="menu">
  <svg width="18" height="18" viewBox="0 0 18 18" fill="none"
    stroke="white" stroke-width="1.5" stroke-linecap="round">
    <line x1="2" y1="4" x2="16" y2="4"/>
    <line x1="2" y1="9" x2="16" y2="9"/>
    <line x1="2" y1="14" x2="16" y2="14"/>
  </svg>
</button>

<div id="mob-overlay"></div>

<div id="mob-drawer">
  <button id="mob-close">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none"
    stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <line x1="2" y1="2" x2="14" y2="14"/>
    <line x1="14" y1="2" x2="2" y2="14"/>
  </svg>
</button>
  <a href="/">home</a>
  <a href="/blog/">blog</a>
  <a href="/media/">media</a>
  <a href="/it-portfolio/">portfolio</a>
  <a href="/experience/">experience</a>
  <a href="https://cv.ryancranie.com" target="_blank">cv ↗</a>
</div>

<script>
(function(){
  var btn = document.getElementById('mob-btn');
  var drawer = document.getElementById('mob-drawer');
  var overlay = document.getElementById('mob-overlay');
  var close = document.getElementById('mob-close');
  function open(){
    drawer.classList.add('open');
    overlay.classList.add('open');
    document.body.style.overflow='hidden';
  }
  function shut(){
    drawer.classList.remove('open');
    overlay.classList.remove('open');
    document.body.style.overflow='';
  }
  btn.addEventListener('click', open);
  close.addEventListener('click', shut);
  overlay.addEventListener('click', shut);
})();
</script>
