name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # Last.fm music sync every 3 hours
  workflow_dispatch:

permissions:
  contents: write

# one run at a time; a queued run waits instead of cancelling the one in progress
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install script dependencies
        run: python -m pip install -r scripts/requirements.txt
      # a failed sync never blocks the deploy: the site builds from the data already committed
      - name: Last.fm sync
        id: sync
        continue-on-error: true
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scripts/import_media.py lastfm-sync
      - name: Commit sync changes
        if: steps.sync.outcome == 'success'
        continue-on-error: true
        run: |
          git add site/data/media/ site/static/img/media/music/
          if git diff --cached --quiet; then
            echo "No changes from the sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "music: lastfm sync"
          # rebase onto anything pushed meanwhile, so the sync never clobbers newer commits
          git pull --rebase origin main || { git rebase --abort; exit 1; }
          git push origin HEAD:main
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true
      - name: Media last updated
        run: echo "HUGO_PARAMS_MEDIAUPDATED=$(git log -1 --format=%cs -- site/data/media)" >> "$GITHUB_ENV"
      - name: Build
        run: hugo --minify --source site
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/public
          cname: ryancranie.com
          force_orphan: true
