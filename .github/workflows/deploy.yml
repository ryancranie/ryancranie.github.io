name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.168.0'
          extended: true
      - name: Media last updated
        run: echo "HUGO_PARAMS_MEDIAUPDATED=$(git log -1 --format=%cs -- site/data/media)" >> "$GITHUB_ENV"
      - name: Build
        run: hugo --minify --source site
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/public
          cname: ryancranie.com
          force_orphan: true
